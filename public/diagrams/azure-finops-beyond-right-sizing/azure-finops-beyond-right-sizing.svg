<text class="title" x="42" y="84">Beyond Right-Sizing: An Azure FinOps Operating Loop</text><text class="sub" x="42" y="112">Continuous cost visibility, informed decisions, safer changes, and verified savings.</text><g><rect class="panel" x="42" y="160" width="134" height="95" rx="14"/><text class="node-title" x="60" y="190">Inventory</text><text class="node-text" x="60" y="212">Map resources</text><text class="node-text" x="60" y="229">and ownership</text></g><g><rect class="panel" x="200" y="160" width="134" height="95" rx="14"/><text class="node-title" x="218" y="190">Measure</text><text class="node-text" x="218" y="212">Analyze cost</text><text class="node-text" x="218" y="229">and utilization</text></g><g><rect class="panel" x="358" y="160" width="134" height="95" rx="14"/><text class="node-title" x="376" y="190">Understand</text><text class="node-text" x="376" y="212">Apply workload</text><text class="node-text" x="376" y="229">and risk context</text></g><g><rect class="panel2" x="516" y="160" width="134" height="95" rx="14"/><text class="node-title" x="534" y="190">Optimize</text><text class="node-text" x="534" y="212">Prioritize the</text><text class="node-text" x="534" y="229">right actions</text></g><g><rect class="panel" x="674" y="160" width="166" height="95" rx="14"/><text class="node-title" x="692" y="190">Review &amp; approve</text><text class="node-text" x="692" y="212">Validate impact</text><text class="node-text" x="692" y="229">and risk</text></g><g><rect class="panel" x="864" y="160" width="134" height="95" rx="14"/><text class="node-title" x="882" y="190">Implement</text><text class="node-text" x="882" y="212">Execute safely</text><text class="node-text" x="882" y="229">with rollback</text></g><g><rect class="panel" x="1022" y="160" width="134" height="95" rx="14"/><text class="node-title" x="1040" y="190">Validate</text><text class="node-text" x="1040" y="212">Confirm stability</text><text class="node-text" x="1040" y="229">and savings</text></g><g><rect class="panel" x="42" y="310" width="150" height="67" rx="14"/><text class="node-title" x="60" y="340">Remove waste</text><text class="node-text" x="60" y="362">Optimize in sequence</text></g><g><rect class="panel" x="235.2" y="310" width="150" height="67" rx="14"/><text class="node-title" x="253.2" y="340">Reduce runtime</text><text class="node-text" x="253.2" y="362">Optimize in sequence</text></g><g><rect class="panel" x="428.4" y="310" width="150" height="67" rx="14"/><text class="node-title" x="446.4" y="340">Right-size</text><text class="node-text" x="446.4" y="362">Optimize in sequence</text></g><g><rect class="panel" x="621.6" y="310" width="150" height="67" rx="14"/><text class="node-title" x="639.6" y="340">Storage &amp; DR</text><text class="node-text" x="639.6" y="362">Optimize in sequence</text></g><g><rect class="panel" x="814.8" y="310" width="150" height="67" rx="14"/><text class="node-title" x="832.8" y="340">Simplify</text><text class="node-text" x="832.8" y="362">Optimize in sequence</text></g><g><rect class="panel" x="1008" y="310" width="150" height="67" rx="14"/><text class="node-title" x="1026" y="340">Commit last</text><text class="node-text" x="1026" y="362">Optimize in sequence</text></g><path class="muteflow" d="M583 255 V288 H117 V305"/><path class="muteflow" d="M583 288 H1083 V305"/><path class="flow" d="M176 207 H195"/><path class="flow" d="M334 207 H353"/><path class="flow" d="M492 207 H511"/><path class="flow" d="M650 207 H669"/><path class="flow" d="M840 207 H859"/><path class="flow" d="M998 207 H1017"/><path class="flow" d="M1089 160 V135 H110 C80 135 80 150 80 158"/><rect class="panel2" x="42" y="420" width="1116" height="155" rx="18"/><text class="sect" x="62" y="454">VERIFIED OUTCOMES</text><g><rect class="panel2" x="62" y="470" width="245" height="82" rx="14"/><text class="node-title" x="80" y="500">$1M+ cumulative contribution</text><text class="node-text" x="80" y="522">Across multiple Azure</text><text class="node-text" x="80" y="539">optimization initiatives</text></g><g><rect class="panel" x="335" y="470" width="230" height="82" rx="14"/><text class="node-title" x="353" y="500">Reliability protected</text><text class="node-text" x="353" y="522">No compromise on required</text><text class="node-text" x="353" y="539">availability or performance</text></g><g><rect class="panel" x="593" y="470" width="230" height="82" rx="14"/><text class="node-title" x="611" y="500">Stronger collaboration</text><text class="node-text" x="611" y="522">Infrastructure, applications,</text><text class="node-text" x="611" y="539">finance, and governance</text></g><g><rect class="panel" x="851" y="470" width="275" height="82" rx="14"/><text class="node-title" x="869" y="500">Repeatable operating model</text><text class="node-text" x="869" y="522">Continuous improvement,</text><text class="node-text" x="869" y="539">not one-time cleanup</text></g><line x1="42" y1="626" x2="1158" y2="626" stroke="#3D4943"/><rect x="42" y="642" width="4" height="18" fill="#34D399"/><text class="foot" x="58" y="656">FinOps keeps cloud architecture aligned with workload reality.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Building a Permanent K3s Home Lab</title><desc id="desc">A lightweight, persistent Kubernetes environment for learning and self-hosting.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker>
  <style><![CDATA[
    .bg{fill:#060E0A}.panel{fill:#0D1913;stroke:#3D4943;stroke-width:1.4}.panel2{fill:#12211A;stroke:#34D399;stroke-width:1.6}
    .future{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:8 7}.title{font:700 34px Arial,sans-serif;fill:#E8F2EC}.sub{font:400 16px Arial,sans-serif;fill:#9DB3A7}
    .eyebrow{font:600 11px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;letter-spacing:2px;fill:#34D399}.sect{font:700 20px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;fill:#34D399}
    .node-title{font:700 15px Arial,sans-serif;fill:#E8F2EC}.node-text{font:400 11.5px Arial,sans-serif;fill:#9DB3A7}.small{font:500 10.5px Arial,sans-serif;fill:#9DB3A7}
    .foot{font:600 11px Arial,sans-serif;fill:#E8F2EC}.brand{font:700 14px Arial,sans-serif;fill:#E8F2EC}.flow{fill:none;stroke:#34D399;stroke-width:2;marker-end:url(#arrow)}
    .muteflow{fill:none;stroke:#9DB3A7;stroke-width:1.5;marker-end:url(#arrow)}.dashflow{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow)}
  ]]></style>
</defs><rect class="bg" width="1200" height="675"/>
<line x1="42" y1="35" x2="78" y2="35" stroke="#34D399" stroke-width="2"/><text class="eyebrow" x="90" y="39">HOME-LAB ARCHITECTURE</text><text class="title" x="42" y="84">Building a Permanent K3s Home Lab</text><text class="sub" x="42" y="112">A lightweight, persistent Kubernetes environment for learning and self-hosting.</text><g><rect class="panel" x="42" y="265" width="146" height="100" rx="14"/><text class="node-title" x="58" y="295">Private access</text><text class="node-text" x="58" y="317">Internet or VPN</text><text class="node-text" x="58" y="334">when required</text></g><g><rect class="panel" x="206" y="265" width="180" height="100" rx="14"/><text class="node-title" x="222" y="295">Home router / firewall</text><text class="node-text" x="222" y="317">Network boundary</text><text class="node-text" x="222" y="334">controlled exposure</text></g><path class="flow" d="M188 315 H201"/><path class="flow" d="M386 315 H405"/><rect class="panel2" x="410" y="150" width="526" height="365" rx="18"/><text class="sect" x="434" y="183">CURRENT: SINGLE-NODE K3S</text><text class="node-text" x="434" y="204">Linux host, physical or virtual</text><g><rect class="panel" x="434" y="225" width="478" height="65" rx="14"/><text class="node-title" x="450" y="255">Ingress</text><text class="node-text" x="450" y="277">Routing and TLS</text></g><g><rect class="panel" x="434" y="315" width="132" height="100" rx="14"/><text class="node-title" x="450" y="345">Workloads</text><text class="node-text" x="450" y="367">Self-hosted</text><text class="node-text" x="450" y="384">services</text></g><g><rect class="panel" x="577" y="315" width="188" height="100" rx="14"/><text class="node-title" x="591" y="345">Persistent volumes</text><text class="node-text" x="591" y="367">Kubernetes</text><text class="node-text" x="591" y="384">storage claims</text></g><g><rect class="panel" x="776" y="315" width="136" height="100" rx="14"/><text class="node-title" x="792" y="345">Local storage</text><text class="node-text" x="792" y="367">SSD / NVMe / HDD</text><text class="node-text" x="792" y="384">application data</text></g><path class="muteflow" d="M671 290 V310"/><rect class="panel" x="956" y="150" width="202" height="365" rx="18"/><text class="sect" x="976" y="183">OPERATIONS</text><g><rect class="panel" x="976" y="205" width="162" height="52" rx="14"/><text class="node-title" x="990" y="228">Git repository</text><text class="node-text" x="990" y="246">Configuration as code</text></g><g><rect class="panel" x="976" y="265" width="162" height="52" rx="14"/><text class="node-title" x="990" y="288">Automation</text><text class="node-text" x="990" y="306">Controlled deployment</text></g><g><rect class="panel" x="976" y="325" width="162" height="52" rx="14"/><text class="node-title" x="990" y="348">Monitoring</text><text class="node-text" x="990" y="366">Metrics, logs, alerts</text></g><g><rect class="panel" x="976" y="385" width="162" height="52" rx="14"/><text class="node-title" x="990" y="408">Backups</text><text class="node-text" x="990" y="426">Off-node data copy</text></g><g><rect class="panel" x="976" y="445" width="162" height="52" rx="14"/><text class="node-title" x="990" y="468">Maintenance</text><text class="node-text" x="990" y="486">Patching and certificates</text></g><rect class="future" x="725" y="535" width="433" height="70" rx="18"/><text class="sect" x="745" y="562">FUTURE — NOT YET IMPLEMENTED</text><text class="node-text" x="745" y="586">Additional worker nodes and NAS / network storage when required</text><path class="dashflow" d="M875 515 V530"/><line x1="42" y1="626" x2="1158" y2="626" stroke="#3D4943"/><rect x="42" y="642" width="4" height="18" fill="#34D399"/><text class="foot" x="58" y="656">A small lab. A big playground. Same engineering habits, different scale.</text><g transform="translate(965 629)"><g transform="scale(0.0664)"><rect width="512" height="512" rx="112" fill="#F4F9F6"/><path fill="#0B1A12" fill-rule="evenodd" d="M72 96H280V304H144V416H72ZM144 160V240H216V160Z"/><path fill="#10B981" d="M216 304H280V272H368V96H440V416H368V344H280V416H216Z"/></g></g><text class="brand" x="1009" y="644">Prashant Hegde</text><text class="small" x="1009" y="660">prashanthegde.in</text>
</svg>

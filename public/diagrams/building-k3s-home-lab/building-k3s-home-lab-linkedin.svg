<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Building a Permanent K3s Home Lab</title><desc id="desc">A lightweight, persistent Kubernetes environment for learning and self-hosting.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker>
  <style><![CDATA[
    .bg{fill:#060E0A}.panel{fill:#0D1913;stroke:#3D4943;stroke-width:1.4}.panel2{fill:#12211A;stroke:#34D399;stroke-width:1.6}
    .future{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:8 7}.title{font:700 52px Arial,sans-serif;fill:#E8F2EC}.sub{font:400 23px Arial,sans-serif;fill:#9DB3A7}
    .eyebrow{font:600 15px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;letter-spacing:2px;fill:#34D399}.sect{font:700 29px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;fill:#34D399}
    .node-title{font:700 27px Arial,sans-serif;fill:#E8F2EC}.node-text{font:400 19px Arial,sans-serif;fill:#9DB3A7}.small{font:500 14.5px Arial,sans-serif;fill:#9DB3A7}
    .foot{font:600 18px Arial,sans-serif;fill:#E8F2EC}.brand{font:700 21px Arial,sans-serif;fill:#E8F2EC}.flow{fill:none;stroke:#34D399;stroke-width:2;marker-end:url(#arrow)}
    .muteflow{fill:none;stroke:#9DB3A7;stroke-width:1.5;marker-end:url(#arrow)}.dashflow{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow)}
  ]]></style>
</defs><rect class="bg" width="1200" height="1200"/>
<line x1="42" y1="62" x2="78" y2="62" stroke="#34D399" stroke-width="2"/><text class="eyebrow" x="90" y="66">HOME-LAB ARCHITECTURE</text><text class="title" x="42" y="140">Building a Permanent</text><text class="title" x="42" y="200">K3s Home Lab</text><text class="sub" x="42" y="244">A lightweight, persistent Kubernetes environment for learning and self-hosting.</text><g><rect class="panel" x="62" y="284" width="330" height="108" rx="14"/><text class="node-title" x="82" y="318.9">Private access</text><text class="node-text" x="82" y="351.9">Internet or VPN</text><text class="node-text" x="82" y="378.5">when required</text></g><g><rect class="panel" x="448" y="284" width="450" height="108" rx="14"/><text class="node-title" x="468" y="318.9">Home router / firewall</text><text class="node-text" x="468" y="351.9">Network boundary</text><text class="node-text" x="468" y="378.5">controlled exposure</text></g><path class="flow" d="M392 338 H444"/><path class="flow" d="M673 392 V406"/><rect class="panel2" x="42" y="410" width="1116" height="310" rx="18"/><text class="sect" x="62" y="452">CURRENT: SINGLE-NODE K3S</text><text class="node-text" x="62" y="478">Linux host, physical or virtual</text><g><rect class="panel" x="62" y="492" width="1076" height="82" rx="14"/><text class="node-title" x="82" y="527.2">Ingress</text><text class="node-text" x="82" y="560.2">Routing and TLS</text></g><path class="muteflow" d="M600 574 V590"/><g><rect class="panel" x="62" y="594" width="340" height="110" rx="14"/><text class="node-title" x="82" y="629.9">Workloads</text><text class="node-text" x="82" y="662.9">Self-hosted</text><text class="node-text" x="82" y="689.5">services</text></g><g><rect class="panel" x="430" y="594" width="340" height="110" rx="14"/><text class="node-title" x="448" y="629.9">Persistent volumes</text><text class="node-text" x="448" y="662.9">Kubernetes</text><text class="node-text" x="448" y="689.5">storage claims</text></g><g><rect class="panel" x="798" y="594" width="340" height="110" rx="14"/><text class="node-title" x="818" y="629.9">Local storage</text><text class="node-text" x="818" y="662.9">SSD / NVMe / HDD</text><text class="node-text" x="818" y="689.5">application data</text></g><rect class="panel" x="42" y="740" width="1116" height="236" rx="18"/><text class="sect" x="62" y="780">OPERATIONS</text><g><rect class="panel" x="62" y="798" width="340" height="80" rx="14"/><text class="node-title" x="80" y="832.9">Git repository</text><text class="node-text" x="80" y="864.9">Configuration as code</text></g><g><rect class="panel" x="430" y="798" width="340" height="80" rx="14"/><text class="node-title" x="448" y="832.9">Automation</text><text class="node-text" x="448" y="864.9">Controlled deployment</text></g><g><rect class="panel" x="798" y="798" width="340" height="80" rx="14"/><text class="node-title" x="816" y="832.9">Monitoring</text><text class="node-text" x="816" y="864.9">Metrics, logs, alerts</text></g><g><rect class="panel" x="62" y="890" width="340" height="80" rx="14"/><text class="node-title" x="80" y="924.9">Backups</text><text class="node-text" x="80" y="956.9">Off-node data copy</text></g><g><rect class="panel" x="430" y="890" width="340" height="80" rx="14"/><text class="node-title" x="448" y="924.9">Maintenance</text><text class="node-text" x="448" y="956.9">Patching and certificates</text></g><rect class="future" x="42" y="1000" width="1116" height="90" rx="18"/><text class="sect" x="62" y="1038">FUTURE — NOT YET IMPLEMENTED</text><text class="node-text" x="62" y="1068">Additional worker nodes and NAS / network storage when required</text><line x1="42" y1="1136" x2="1158" y2="1136" stroke="#3D4943"/><rect x="42" y="1156" width="4" height="20" fill="#34D399"/><text class="foot" x="58" y="1171">A small lab. A big playground. Same engineering habits, different scale.</text><g transform="translate(942 1150)"><g transform="scale(0.0664)"><rect width="512" height="512" rx="112" fill="#F4F9F6"/><path fill="#0B1A12" fill-rule="evenodd" d="M72 96H280V304H144V416H72ZM144 160V240H216V160Z"/><path fill="#10B981" d="M216 304H280V272H368V96H440V416H368V344H280V416H216Z"/></g></g><text class="brand" x="986" y="1165">Prashant Hegde</text><text class="small" x="986" y="1181">prashanthegde.in</text>
</svg>

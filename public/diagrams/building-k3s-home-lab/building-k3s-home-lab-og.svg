<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Building a Permanent K3s Home Lab</title><desc id="desc">A lightweight, persistent Kubernetes environment for learning and self-hosting.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker>
  <style><![CDATA[
    .bg{fill:#060E0A}.panel{fill:#0D1913;stroke:#3D4943;stroke-width:1.4}.panel2{fill:#12211A;stroke:#34D399;stroke-width:1.6}
    .future{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:8 7}.title{font:700 44px Arial,sans-serif;fill:#E8F2EC}.sub{font:400 20px Arial,sans-serif;fill:#9DB3A7}
    .eyebrow{font:600 13px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;letter-spacing:2px;fill:#34D399}.sect{font:700 21px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;fill:#34D399}
    .node-title{font:700 17px Arial,sans-serif;fill:#E8F2EC}.node-text{font:400 13px Arial,sans-serif;fill:#9DB3A7}.small{font:500 12px Arial,sans-serif;fill:#9DB3A7}
    .foot{font:600 14px Arial,sans-serif;fill:#E8F2EC}.brand{font:700 16px Arial,sans-serif;fill:#E8F2EC}.flow{fill:none;stroke:#34D399;stroke-width:2;marker-end:url(#arrow)}
    .muteflow{fill:none;stroke:#9DB3A7;stroke-width:1.5;marker-end:url(#arrow)}.dashflow{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow)}
  ]]></style>
</defs><rect class="bg" width="1200" height="630"/>
<line x1="42" y1="36" x2="78" y2="36" stroke="#34D399" stroke-width="2"/><text class="eyebrow" x="90" y="40">HOME-LAB ARCHITECTURE</text><text class="title" x="42" y="86">Building a Permanent K3s Home Lab</text><text class="sub" x="42" y="116">A lightweight, persistent Kubernetes environment for learning and self-hosting.</text><g><rect class="panel" x="42" y="252" width="146" height="112" rx="14"/><text class="node-title" x="58" y="293.4">Private access</text><text class="node-text" x="58" y="317.5">Internet or VPN</text><text class="node-text" x="58" y="335.7">when required</text></g><g><rect class="panel" x="206" y="252" width="146" height="112" rx="14"/><text class="node-title" x="222" y="282.4">Home router /</text><text class="node-title" x="222" y="304.5">firewall</text><text class="node-text" x="222" y="328.6">Network boundary</text><text class="node-text" x="222" y="346.8">controlled exposure</text></g><path class="flow" d="M188 308 H202"/><path class="flow" d="M352 308 H360"/><rect class="panel2" x="364" y="140" width="544" height="346" rx="18"/><text class="sect" x="386" y="176">CURRENT: SINGLE-NODE K3S</text><text class="node-text" x="386" y="198">Linux host, physical or virtual</text><g><rect class="panel" x="386" y="214" width="500" height="62" rx="14"/><text class="node-title" x="404" y="239.5">Ingress</text><text class="node-text" x="404" y="263.6">Routing and TLS</text></g><path class="muteflow" d="M636 276 V298"/><g><rect class="panel" x="386" y="300" width="156" height="160" rx="14"/><text class="node-title" x="402" y="365.4">Workloads</text><text class="node-text" x="402" y="389.5">Self-hosted</text><text class="node-text" x="402" y="407.7">services</text></g><g><rect class="panel" x="554" y="300" width="156" height="160" rx="14"/><text class="node-title" x="570" y="354.4">Persistent</text><text class="node-title" x="570" y="376.5">volumes</text><text class="node-text" x="570" y="400.6">Kubernetes</text><text class="node-text" x="570" y="418.8">storage claims</text></g><g><rect class="panel" x="722" y="300" width="164" height="160" rx="14"/><text class="node-title" x="738" y="354.4">Local</text><text class="node-title" x="738" y="376.5">storage</text><text class="node-text" x="738" y="400.6">SSD / NVMe / HDD</text><text class="node-text" x="738" y="418.8">application data</text></g><rect class="panel" x="926" y="140" width="232" height="346" rx="18"/><text class="sect" x="946" y="176">OPERATIONS</text><g><rect class="panel" x="946" y="186" width="192" height="58" rx="14"/><text class="node-title" x="960" y="209.5">Git repository</text><text class="node-text" x="960" y="232">Configuration as code</text></g><g><rect class="panel" x="946" y="245" width="192" height="58" rx="14"/><text class="node-title" x="960" y="268.5">Automation</text><text class="node-text" x="960" y="291">Controlled deployment</text></g><g><rect class="panel" x="946" y="304" width="192" height="58" rx="14"/><text class="node-title" x="960" y="327.5">Monitoring</text><text class="node-text" x="960" y="350">Metrics, logs, alerts</text></g><g><rect class="panel" x="946" y="363" width="192" height="58" rx="14"/><text class="node-title" x="960" y="386.5">Backups</text><text class="node-text" x="960" y="409">Off-node data copy</text></g><g><rect class="panel" x="946" y="422" width="192" height="58" rx="14"/><text class="node-title" x="960" y="445.5">Maintenance</text><text class="node-text" x="960" y="468">Patching and certificates</text></g><rect class="future" x="650" y="504" width="508" height="60" rx="18"/><text class="sect" x="670" y="530">FUTURE — NOT YET IMPLEMENTED</text><text class="node-text" x="670" y="551">Additional worker nodes and NAS / network storage when required</text><path class="dashflow" d="M780 486 V500"/><line x1="42" y1="572.4" x2="1158" y2="572.4" stroke="#3D4943"/><rect x="42" y="591" width="4" height="18" fill="#34D399"/><text class="foot" x="58" y="604.5">A small lab. A big playground. Same engineering habits, different scale.</text><g transform="translate(963.6 585)"><g transform="scale(0.05976)"><rect width="512" height="512" rx="112" fill="#F4F9F6"/><path fill="#0B1A12" fill-rule="evenodd" d="M72 96H280V304H144V416H72ZM144 160V240H216V160Z"/><path fill="#10B981" d="M216 304H280V272H368V96H440V416H368V344H280V416H216Z"/></g></g><text class="brand" x="1003.2" y="598.5">Prashant Hegde</text><text class="small" x="1003.2" y="612.9">prashanthegde.in</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Architecture That Works Beyond Go-Live</title><desc id="desc">Deployment is one event. Architecture covers the entire workload lifecycle.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker>
  <style><![CDATA[
    .bg{fill:#060E0A}.panel{fill:#0D1913;stroke:#3D4943;stroke-width:1.4}.panel2{fill:#12211A;stroke:#34D399;stroke-width:1.6}
    .future{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:8 7}.title{font:700 52px Arial,sans-serif;fill:#E8F2EC}.sub{font:400 23px Arial,sans-serif;fill:#9DB3A7}
    .eyebrow{font:600 15px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;letter-spacing:2px;fill:#34D399}.sect{font:700 29px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;fill:#34D399}
    .node-title{font:700 27px Arial,sans-serif;fill:#E8F2EC}.node-text{font:400 19px Arial,sans-serif;fill:#9DB3A7}.small{font:500 14.5px Arial,sans-serif;fill:#9DB3A7}
    .foot{font:600 18px Arial,sans-serif;fill:#E8F2EC}.brand{font:700 21px Arial,sans-serif;fill:#E8F2EC}.flow{fill:none;stroke:#34D399;stroke-width:2;marker-end:url(#arrow)}
    .muteflow{fill:none;stroke:#9DB3A7;stroke-width:1.5;marker-end:url(#arrow)}.dashflow{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow)}
  ]]></style>
</defs><rect class="bg" width="1200" height="1200"/>
<line x1="42" y1="62" x2="78" y2="62" stroke="#34D399" stroke-width="2"/><text class="eyebrow" x="90" y="66">CLOUD ARCHITECTURE LIFECYCLE</text><text class="title" x="42" y="140">Architecture That Works</text><text class="title" x="42" y="200">Beyond Go-Live</text><text class="sub" x="42" y="244">Deployment is one event. Architecture covers the entire workload lifecycle.</text><rect class="panel" x="42" y="276" width="1116" height="196" rx="18"/><text class="sect" x="62" y="320">DAY 1</text><text class="node-text" x="62" y="346">From design to deployment</text><g><rect class="panel" x="62" y="366" width="342" height="86" rx="14"/><text class="node-title" x="80" y="403.2">Design</text><text class="node-text" x="80" y="436.2">Requirements and architecture</text></g><g><rect class="panel" x="434" y="366" width="342" height="86" rx="14"/><text class="node-title" x="452" y="403.2">Build</text><text class="node-text" x="452" y="436.2">Infrastructure and configuration</text></g><g><rect class="panel" x="806" y="366" width="342" height="86" rx="14"/><text class="node-title" x="824" y="403.2">Deploy</text><text class="node-text" x="824" y="436.2">Release and go-live</text></g><path class="flow" d="M404 409 H430"/><path class="flow" d="M776 409 H802"/><rect class="panel2" x="42" y="496" width="1116" height="396" rx="18"/><text class="sect" x="62" y="540">DAY 2+</text><text class="node-text" x="62" y="566">Operate, secure, optimize and keep improving</text><g><rect class="panel" x="62" y="592" width="342" height="86" rx="14"/><text class="node-title" x="80" y="629.2">Operate</text><text class="node-text" x="80" y="662.2">Run, support, change</text></g><g><rect class="panel" x="434" y="592" width="342" height="86" rx="14"/><text class="node-title" x="452" y="629.2">Monitor</text><text class="node-text" x="452" y="662.2">Observe and detect</text></g><g><rect class="panel" x="806" y="592" width="342" height="86" rx="14"/><text class="node-title" x="824" y="629.2">Patch</text><text class="node-text" x="824" y="662.2">OS and dependencies</text></g><g><rect class="panel2" x="62" y="744" width="342" height="86" rx="14"/><text class="node-title" x="80" y="781.2">Optimize</text><text class="node-text" x="80" y="814.2">Reduce waste and right-size</text></g><g><rect class="panel2" x="434" y="744" width="342" height="86" rx="14"/><text class="node-title" x="452" y="781.2">Automate</text><text class="node-text" x="452" y="814.2">Remove repetitive work</text></g><g><rect class="panel" x="806" y="744" width="342" height="86" rx="14"/><text class="node-title" x="824" y="781.2">Secure</text><text class="node-text" x="824" y="814.2">Identity and compliance</text></g><path class="flow" d="M404 635 H430"/><path class="flow" d="M776 635 H802"/><path class="flow" d="M977 678 V740"/><path class="flow" d="M806 787 H780"/><path class="flow" d="M434 787 H408"/><path class="flow" d="M233 744 V682"/><rect class="panel" x="42" y="916" width="1116" height="164" rx="18"/><text class="sect" x="62" y="958">EVOLVE / RETIRE</text><g><rect class="panel" x="62" y="980" width="342" height="82" rx="14"/><text class="node-title" x="80" y="1015.2">Recover</text><text class="node-text" x="80" y="1048.2">Meet RTO and RPO</text></g><g><rect class="panel" x="434" y="980" width="342" height="82" rx="14"/><text class="node-title" x="452" y="1015.2">Evolve</text><text class="node-text" x="452" y="1048.2">Modernize and adapt</text></g><g><rect class="panel" x="806" y="980" width="342" height="82" rx="14"/><text class="node-title" x="824" y="1015.2">Retire</text><text class="node-text" x="824" y="1048.2">Decommission and clean up</text></g><path class="flow" d="M404 1021 H430"/><path class="flow" d="M776 1021 H802"/><line x1="42" y1="1136" x2="1158" y2="1136" stroke="#3D4943"/><rect x="42" y="1156" width="4" height="20" fill="#34D399"/><text class="foot" x="58" y="1171">Good architecture is operated, improved, and trusted for the long term.</text><g transform="translate(942 1150)"><g transform="scale(0.0664)"><rect width="512" height="512" rx="112" fill="#F4F9F6"/><path fill="#0B1A12" fill-rule="evenodd" d="M72 96H280V304H144V416H72ZM144 160V240H216V160Z"/><path fill="#10B981" d="M216 304H280V272H368V96H440V416H368V344H280V416H216Z"/></g></g><text class="brand" x="986" y="1165">Prashant Hegde</text><text class="small" x="986" y="1181">prashanthegde.in</text>
</svg>

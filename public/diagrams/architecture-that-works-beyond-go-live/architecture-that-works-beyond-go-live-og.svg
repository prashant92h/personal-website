</defs><rect class="bg" width="1200" height="630"/>
<line x1="42" y1="36" x2="78" y2="36" stroke="#34D399" stroke-width="2"/><text class="eyebrow" x="90" y="40">CLOUD ARCHITECTURE LIFECYCLE</text><text class="title" x="42" y="86">Architecture That Works Beyond Go-Live</text><text class="sub" x="42" y="116">Deployment is one event. Architecture covers the entire workload lifecycle.</text><rect class="panel" x="42" y="148" width="1116" height="96" rx="18"/><text class="sect" x="62" y="186">DAY 1</text><text class="node-text" x="62" y="210">From design to deployment</text><g><rect class="panel" x="300" y="160" width="256" height="72" rx="14"/><text class="node-title" x="318" y="190.7">Design</text><text class="node-text" x="318" y="217.1">Requirements and architecture</text></g><g><rect class="panel" x="586" y="160" width="256" height="72" rx="14"/><text class="node-title" x="604" y="190.7">Build</text><text class="node-text" x="604" y="217.1">Infrastructure and configuration</text></g><g><rect class="panel" x="872" y="160" width="256" height="72" rx="14"/><text class="node-title" x="890" y="190.7">Deploy</text><text class="node-text" x="890" y="217.1">Release and go-live</text></g><path class="flow" d="M556 196 H578"/><path class="flow" d="M842 196 H864"/><rect class="panel2" x="42" y="256" width="1116" height="196" rx="18"/><text class="sect" x="62" y="294">DAY 2+</text><text class="node-text" x="62" y="318">Operate, secure, optimize</text><text class="node-text" x="62" y="337">and keep improving</text><g><rect class="panel" x="300" y="270" width="190" height="70" rx="14"/><text class="node-title" x="318" y="299.7">Operate</text><text class="node-text" x="318" y="326.1">Run, support, change</text></g><g><rect class="panel" x="516" y="270" width="190" height="70" rx="14"/><text class="node-title" x="534" y="299.7">Monitor</text><text class="node-text" x="534" y="326.1">Observe and detect</text></g><g><rect class="panel" x="732" y="270" width="190" height="70" rx="14"/><text class="node-title" x="750" y="299.7">Patch</text><text class="node-text" x="750" y="326.1">OS and dependencies</text></g><g><rect class="panel" x="948" y="270" width="190" height="70" rx="14"/><text class="node-title" x="966" y="299.7">Secure</text><text class="node-text" x="966" y="326.1">Identity and compliance</text></g><path class="flow" d="M490 305 H514"/><path class="flow" d="M706 305 H730"/><path class="flow" d="M922 305 H946"/><g><rect class="panel2" x="510" y="362" width="250" height="70" rx="14"/><text class="node-title" x="528" y="391.7">Optimize</text><text class="node-text" x="528" y="418.1">Reduce waste and right-size</text></g><g><rect class="panel2" x="786" y="362" width="250" height="70" rx="14"/><text class="node-title" x="804" y="391.7">Automate</text><text class="node-text" x="804" y="418.1">Remove repetitive work</text></g><path class="flow" d="M1001 340 V351 H911 V358"/><path class="flow" d="M786 397 H766"/><path class="flow" d="M510 397 H395 V344"/><rect class="panel" x="42" y="466" width="1116" height="84" rx="18"/><text class="sect" x="62" y="514">EVOLVE / RETIRE</text><g><rect class="panel" x="300" y="474" width="256" height="68" rx="14"/><text class="node-title" x="318" y="502.7">Recover</text><text class="node-text" x="318" y="529.1">Meet RTO and RPO</text></g><g><rect class="panel" x="586" y="474" width="256" height="68" rx="14"/><text class="node-title" x="604" y="502.7">Evolve</text><text class="node-text" x="604" y="529.1">Modernize and adapt</text></g><g><rect class="panel" x="872" y="474" width="256" height="68" rx="14"/><text class="node-title" x="890" y="502.7">Retire</text><text class="node-text" x="890" y="529.1">Decommission and clean up</text></g><path class="flow" d="M556 508 H578"/><path class="flow" d="M842 508 H864"/><line x1="42" y1="572.4" x2="1158" y2="572.4" stroke="#3D4943"/><rect x="42" y="591" width="4" height="18" fill="#34D399"/><text class="foot" x="58" y="604.5">Good architecture is operated, improved, and trusted for the long term.</text><g transform="translate(963.6 585)"><g transform="scale(0.05976)"><rect width="512" height="512" rx="112" fill="#F4F9F6"/><path fill="#0B1A12" fill-rule="evenodd" d="M72 96H280V304H144V416H72ZM144 160V240H216V160Z"/><path fill="#10B981" d="M216 304H280V272H368V96H440V416H368V344H280V416H216Z"/></g></g><text class="brand" x="1003.2" y="598.5">Prashant Hegde</text><text class="small" x="1003.2" y="612.9">prashanthegde.in</text>

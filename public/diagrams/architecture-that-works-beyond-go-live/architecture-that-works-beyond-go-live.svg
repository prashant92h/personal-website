<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Architecture That Works Beyond Go-Live</title><desc id="desc">Deployment is one event. Architecture covers the entire workload lifecycle.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker>
  <style><![CDATA[
    .bg{fill:#060E0A}.panel{fill:#0D1913;stroke:#3D4943;stroke-width:1.4}.panel2{fill:#12211A;stroke:#34D399;stroke-width:1.6}
    .future{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:8 7}.title{font:700 34px Arial,sans-serif;fill:#E8F2EC}.sub{font:400 16px Arial,sans-serif;fill:#9DB3A7}
    .eyebrow{font:600 11px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;letter-spacing:2px;fill:#34D399}.sect{font:700 20px 'JetBrains Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;fill:#34D399}
    .node-title{font:700 15px Arial,sans-serif;fill:#E8F2EC}.node-text{font:400 11.5px Arial,sans-serif;fill:#9DB3A7}.small{font:500 10.5px Arial,sans-serif;fill:#9DB3A7}
    .foot{font:600 11px Arial,sans-serif;fill:#E8F2EC}.brand{font:700 14px Arial,sans-serif;fill:#E8F2EC}.flow{fill:none;stroke:#34D399;stroke-width:2;marker-end:url(#arrow)}
    .muteflow{fill:none;stroke:#9DB3A7;stroke-width:1.5;marker-end:url(#arrow)}.dashflow{fill:none;stroke:#34D399;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow)}
  ]]></style>
</defs><rect class="bg" width="1200" height="675"/>
<line x1="42" y1="35" x2="78" y2="35" stroke="#34D399" stroke-width="2"/><text class="eyebrow" x="90" y="39">CLOUD ARCHITECTURE LIFECYCLE</text>
<text class="title" x="42" y="84">Architecture That Works Beyond Go-Live</text><text class="sub" x="42" y="112">Deployment is one event. Architecture covers the entire workload lifecycle.</text><rect class="panel" x="42" y="145" width="1116" height="120" rx="18"/><text class="sect" x="62" y="178">DAY 1</text><text class="node-text" x="62" y="201">From design to deployment</text><g><rect class="panel" x="250" y="162" width="205" height="86" rx="14"/><text class="node-title" x="268" y="192">Design</text><text class="node-text" x="268" y="214">Requirements and architecture</text><text class="node-text" x="268" y="231">Security by design</text></g><g><rect class="panel" x="500" y="162" width="205" height="86" rx="14"/><text class="node-title" x="518" y="192">Build</text><text class="node-text" x="518" y="214">Infrastructure and configuration</text><text class="node-text" x="518" y="231">Testing and validation</text></g><g><rect class="panel" x="750" y="162" width="205" height="86" rx="14"/><text class="node-title" x="768" y="192">Deploy</text><text class="node-text" x="768" y="214">Release and go-live</text><text class="node-text" x="768" y="231">Production validation</text></g><path class="flow" d="M455 205 H495"/><path class="flow" d="M705 205 H745"/><rect class="panel2" x="42" y="282" width="1116" height="220" rx="18"/><text class="sect" x="62" y="320">DAY 2+</text><text class="node-text" x="62" y="344">Operate, secure, optimize</text><text class="node-text" x="62" y="361">and keep improving</text><g><rect class="panel" x="245" y="302" width="170" height="80" rx="14"/><text class="node-title" x="263" y="332">Operate</text><text class="node-text" x="263" y="354">Run, support, change</text></g><g><rect class="panel" x="450" y="302" width="170" height="80" rx="14"/><text class="node-title" x="468" y="332">Monitor</text><text class="node-text" x="468" y="354">Observe and detect</text></g><g><rect class="panel" x="655" y="302" width="170" height="80" rx="14"/><text class="node-title" x="673" y="332">Patch</text><text class="node-text" x="673" y="354">OS and dependencies</text></g><g><rect class="panel" x="860" y="302" width="170" height="80" rx="14"/><text class="node-title" x="878" y="332">Secure</text><text class="node-text" x="878" y="354">Identity and compliance</text></g><path class="flow" d="M415 342 H445"/><path class="flow" d="M620 342 H650"/><path class="flow" d="M825 342 H855"/><g><rect class="panel2" x="420" y="405" width="205" height="72" rx="14"/><text class="node-title" x="438" y="435">Optimize</text><text class="node-text" x="438" y="457">Reduce waste and right-size</text></g><g><rect class="panel2" x="680" y="405" width="205" height="72" rx="14"/><text class="node-title" x="698" y="435">Automate</text><text class="node-text" x="698" y="457">Remove repetitive work</text></g><path class="flow" d="M860 382 V395 H785 V402"/><path class="flow" d="M680 441 H630"/><path class="flow" d="M420 441 H330 V382"/><rect class="panel" x="42" y="520" width="1116" height="88" rx="18"/><text class="sect" x="62" y="553">EVOLVE / RETIRE</text><g><rect class="panel" x="330" y="530" width="190" height="68" rx="14"/><text class="node-title" x="348" y="558">Recover</text><text class="node-text" x="348" y="580">Meet RTO and RPO</text></g><g><rect class="panel" x="565" y="530" width="190" height="68" rx="14"/><text class="node-title" x="583" y="558">Evolve</text><text class="node-text" x="583" y="580">Modernize and adapt</text></g><g><rect class="panel" x="800" y="530" width="190" height="68" rx="14"/><text class="node-title" x="818" y="558">Retire</text><text class="node-text" x="818" y="580">Decommission and clean up</text></g><path class="flow" d="M520 564 H560"/><path class="flow" d="M755 564 H795"/><line x1="42" y1="626" x2="1158" y2="626" stroke="#3D4943"/><rect x="42" y="642" width="4" height="18" fill="#34D399"/><text class="foot" x="58" y="656">Good architecture is operated, improved, and trusted for the long term.</text>
<g transform="translate(965 629)"><g transform="scale(0.0664)"><rect width="512" height="512" rx="112" fill="#F4F9F6"/><path fill="#0B1A12" fill-rule="evenodd" d="M72 96H280V304H144V416H72ZM144 160V240H216V160Z"/><path fill="#10B981" d="M216 304H280V272H368V96H440V416H368V344H280V416H216Z"/></g></g><text class="brand" x="1009" y="644">Prashant Hegde</text><text class="small" x="1009" y="660">prashanthegde.in</text></svg>